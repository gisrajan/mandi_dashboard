name: Daily Vegetable Price Update (Open Source AI)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Prevent parallel runs from fighting over git push
concurrency:
  group: mandi-dashboard-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure data folder and base files exist
        run: |
          mkdir -p data

          if [ ! -f data/market_transcripts_master.csv ]; then
            echo "Date,Title,Video_ID,Transcript" > data/market_transcripts_master.csv
          fi

          if [ ! -f data/prices.json ]; then
            echo '{"last_updated":"never","vegetables":[]}' > data/prices.json
          fi

          echo "Initial data contents:"
          ls -lah data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}-v1
          restore-keys: |
            ollama-${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}-

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          sleep 5

      - name: Run transcript scraper
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || 'UCxEW_BSHnu43J8-ANnSJ80w' }}
          MAX_NEW_VIDEOS: "5"
        run: python scraper.py

      - name: Extract vegetable prices
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}
        run: python parse_prices.py

      # Absolute safety: recreate files if scripts removed them
      - name: Final safety check for data files
        run: |
          mkdir -p data

          if [ ! -f data/market_transcripts_master.csv ]; then
            echo "Date,Title,Video_ID,Transcript" > data/market_transcripts_master.csv
          fi

          if [ ! -f data/prices.json ]; then
            echo '{"last_updated":"never","vegetables":[]}' > data/prices.json
          fi

          echo "Final data contents:"
          ls -lah data

      - name: Commit and push updated data
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Always sync first
          git pull --rebase origin main

          # ✅ CRITICAL FIX: add directory, NOT individual files
          git add data || true

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update mandi prices [$(date -u +'%Y-%m-%d')] via ${OLLAMA_MODEL:-gemma2:2b}"

          # Retry push safely
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed, rebasing and retrying ($i)..."
            git pull --rebase origin main
            sleep 5
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    needs: update-prices
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
