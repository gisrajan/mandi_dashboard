name: Daily Vegetable Price Update (Open Source AI)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mandi-dashboard-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync branch before running scripts
        run: |
          git pull --rebase origin main

      - name: Ensure data and dashboard folders exist
        run: |
          mkdir -p data
          mkdir -p dashboard/data

          if [ ! -f data/market_transcripts_master.csv ]; then
            echo "Date,Title,Video_ID,Transcript" > data/market_transcripts_master.csv
            echo "Created data/market_transcripts_master.csv"
          fi

          if [ ! -f data/prices.json ]; then
            echo '{"last_updated":"never","vegetables":[]}' > data/prices.json
            echo "Created data/prices.json"
          fi

          echo "Current data directory:"
          ls -lah data || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}-v1
          restore-keys: |
            ollama-${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}-

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          sleep 8

      - name: Run transcript scraper
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID || 'UCxEW_BSHnu43J8-ANnSJ80w' }}
          MAX_NEW_VIDEOS: "5"
        run: |
          python scraper.py

      - name: Debug CSV after scraper
        run: |
          echo "Checking for transcript CSV..."
          find . -name "market_transcripts_master.csv" || true
          echo "Listing data directory..."
          ls -lah data || true

      - name: Extract vegetable prices
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}
        run: |
          python parse_prices.py

      - name: Final safety check
        run: |
          mkdir -p data
          mkdir -p dashboard/data

          if [ ! -f data/market_transcripts_master.csv ]; then
            echo "WARNING: data/market_transcripts_master.csv missing after scripts. Recreating placeholder."
            echo "Date,Title,Video_ID,Transcript" > data/market_transcripts_master.csv
          fi

          if [ ! -f data/prices.json ]; then
            echo "WARNING: data/prices.json missing after scripts. Recreating placeholder."
            echo '{"last_updated":"never","vegetables":[]}' > data/prices.json
          fi

          echo "Final data directory:"
          ls -lah data || true

      - name: Commit and push updated data
        env:
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma2:2b' }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage generated files first
          git add -A data

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Commit local changes first
          git commit -m "chore: update mandi prices [$(date -u +'%Y-%m-%d')] via ${OLLAMA_MODEL}"

          # Rebase onto latest remote changes
          git pull --rebase origin main

          # Push with retry loop
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed, retrying after rebase... attempt $i"
            git pull --rebase origin main
            sleep 5
          done

      - name: Copy latest prices.json into dashboard
        run: |
          mkdir -p dashboard/data
          cp data/prices.json dashboard/data/prices.json
          echo "Dashboard data directory:"
          ls -lah dashboard/data

      - name: Debug dashboard contents
        run: |
          echo "Dashboard directory:"
          find dashboard -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    needs: update-prices
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
