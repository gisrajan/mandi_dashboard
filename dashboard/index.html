<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>मंडी भाव • Mandi Live Prices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --soil:     #1a1208;
      --bark:     #2e1f0a;
      --turmeric: #e8a020;
      --saffron:  #f05c1a;
      --leaf:     #3a7d2c;
      --mint:     #5fba47;
      --cream:    #f5edd8;
      --parchment:#ede0c0;
      --dust:     #8b7355;
      --red-chilli:#c0392b;
      --up:       #27ae60;
      --down:     #e74c3c;
      --stable:   #95a5a6;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--soil);
      color: var(--cream);
      font-family: 'DM Serif Display', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Noise grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }

    /* Diagonal pattern background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(232,160,32,0.03) 40px,
        rgba(232,160,32,0.03) 41px
      );
      pointer-events: none;
    }

    /* ── Header ── */
    header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(232,160,32,0.2);
      position: relative;
    }

    .header-ornament {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: var(--turmeric);
      text-transform: uppercase;
      font-family: 'DM Mono', monospace;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-family: 'Tiro Devanagari Hindi', serif;
      color: var(--cream);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    h1 span {
      color: var(--turmeric);
    }

    .subtitle {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      color: var(--dust);
      font-size: 1.05rem;
      margin-top: 0.4rem;
    }

    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--dust);
      letter-spacing: 0.05em;
    }

    .meta-bar .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--mint);
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.2rem 2rem;
      background: var(--bark);
      border-bottom: 1px solid rgba(232,160,32,0.12);
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(232,160,32,0.25);
      border-radius: 4px;
      padding: 0.55rem 1rem 0.55rem 2.4rem;
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus { border-color: var(--turmeric); }
    .search-wrap input::placeholder { color: var(--dust); }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dust);
      font-size: 0.85rem;
    }

    .sort-btns {
      display: flex;
      gap: 0.4rem;
    }

    .sort-btn {
      background: transparent;
      border: 1px solid rgba(232,160,32,0.2);
      color: var(--dust);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.4rem 0.9rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-btn:hover, .sort-btn.active {
      background: var(--turmeric);
      border-color: var(--turmeric);
      color: var(--soil);
    }

    /* ── Trend Summary Bar ── */
    .trend-summary {
      display: flex;
      gap: 0;
      background: var(--bark);
      border-bottom: 2px solid var(--turmeric);
    }

    .trend-pill {
      flex: 1;
      text-align: center;
      padding: 0.7rem 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-right: 1px solid rgba(232,160,32,0.1);
      cursor: pointer;
      transition: background 0.15s;
    }

    .trend-pill:last-child { border-right: none; }
    .trend-pill:hover { background: rgba(255,255,255,0.04); }
    .trend-pill.active-filter { background: rgba(232,160,32,0.1); }

    .trend-pill .count {
      display: block;
      font-size: 1.4rem;
      font-family: 'DM Serif Display', serif;
      margin-bottom: 0.1rem;
    }

    .pill-up   .count { color: var(--up); }
    .pill-down .count { color: var(--down); }
    .pill-stable .count { color: var(--stable); }
    .pill-all  .count { color: var(--turmeric); }

    /* ── Grid ── */
    .grid-container {
      padding: 1.5rem 2rem 4rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .veg-card {
      background: var(--bark);
      border: 1px solid rgba(232,160,32,0.12);
      border-radius: 6px;
      padding: 1.1rem 1.2rem;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      animation: fadeUp 0.4s ease both;
    }

    .veg-card:hover {
      transform: translateY(-3px);
      border-color: rgba(232,160,32,0.4);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Trend color stripe on left */
    .veg-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .veg-card.trend-up::before    { background: var(--up); }
    .veg-card.trend-down::before  { background: var(--down); }
    .veg-card.trend-stable::before{ background: var(--stable); }

    .veg-name-hi {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 1.3rem;
      color: var(--cream);
      line-height: 1.2;
    }

    .veg-name-en {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--dust);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.1rem;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-top: 0.9rem;
    }

    .price-amount {
      font-family: 'DM Serif Display', serif;
      font-size: 1.9rem;
      color: var(--turmeric);
      line-height: 1;
    }

    .price-unit {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--dust);
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      margin-top: 0.6rem;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
    }

    .trend-badge.up    { background: rgba(39,174,96,0.15);  color: var(--up); }
    .trend-badge.down  { background: rgba(231,76,60,0.15);  color: var(--down); }
    .trend-badge.stable{ background: rgba(149,165,166,0.12); color: var(--stable); }

    .card-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--dust);
      margin-top: 0.7rem;
      opacity: 0.7;
    }

    /* Mini sparkline */
    .sparkline {
      margin-top: 0.8rem;
      height: 32px;
    }

    .sparkline svg { display: block; }

    /* ── Empty / Loading states ── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--dust);
      font-style: italic;
      font-size: 1.1rem;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(232,160,32,0.2);
      border-top-color: var(--turmeric);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, var(--soil) 60%);
      padding: 1.2rem 2rem 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }

    footer span {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: rgba(139,115,85,0.5);
      letter-spacing: 0.06em;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .filter-bar { padding: 1rem; }
      .grid-container { padding: 1rem 1rem 4rem; }
      .meta-bar { gap: 1rem; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<header>
  <p class="header-ornament">🌿 Live Market Rates · ताज़े मंडी भाव</p>
  <h1>मंडी <span>भाव</span></h1>
  <p class="subtitle">Daily vegetable prices from the Mandi — straight from YouTube</p>
  <div class="meta-bar">
    <span><span class="dot"></span> &nbsp;LIVE DATA</span>
    <span id="last-updated">Loading…</span>
    <span id="veg-count">— vegetables</span>
  </div>
</header>

<div class="trend-summary">
  <div class="trend-pill pill-all active-filter" data-filter="all" onclick="setFilter('all', this)">
    <span class="count" id="cnt-all">—</span>All
  </div>
  <div class="trend-pill pill-up" data-filter="up" onclick="setFilter('up', this)">
    <span class="count" id="cnt-up">—</span>▲ Rising
  </div>
  <div class="trend-pill pill-down" data-filter="down" onclick="setFilter('down', this)">
    <span class="count" id="cnt-down">—</span>▼ Falling
  </div>
  <div class="trend-pill pill-stable" data-filter="stable" onclick="setFilter('stable', this)">
    <span class="count" id="cnt-stable">—</span>— Stable
  </div>
</div>

<div class="filter-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search vegetable…" oninput="renderCards()" />
  </div>
  <div class="sort-btns">
    <button class="sort-btn active" onclick="setSort('name', this)">A–Z</button>
    <button class="sort-btn" onclick="setSort('price-asc', this)">₹ Low</button>
    <button class="sort-btn" onclick="setSort('price-desc', this)">₹ High</button>
    <button class="sort-btn" onclick="setSort('change', this)">Δ%</button>
  </div>
</div>

<div class="grid-container" id="grid">
  <div class="state-msg">
    <div class="spinner"></div>
    Loading mandi prices…
  </div>
</div>

<footer>
  <span>SOURCE: YOUTUBE · AI EXTRACTION</span>
  <span>मंडी भाव DASHBOARD</span>
</footer>

<script>
  let allVegs = [];
  let currentFilter = 'all';
  let currentSort = 'name';

  // ─── Load data ───────────────────────────────────────────────────────────
  async function loadData() {
    try {
      // Path is relative — prices.json lives one level up from dashboard/
      //const res = await fetch('../data/prices.json', { cache: 'no-cache' });
      const res = await fetch('./data/prices.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('prices.json not found');
      const data = await res.json();

      document.getElementById('last-updated').textContent =
        'Updated: ' + (data.last_updated || 'unknown');

      allVegs = data.vegetables || [];
      updateCounts();
      renderCards();
    } catch (e) {
      // Fallback: show demo data so the dashboard looks right
      allVegs = getDemoData();
      document.getElementById('last-updated').textContent = 'Demo data (prices.json not loaded)';
      updateCounts();
      renderCards();
    }
  }

  // ─── Counts ──────────────────────────────────────────────────────────────
  function updateCounts() {
    const up     = allVegs.filter(v => v.trend === 'up').length;
    const down   = allVegs.filter(v => v.trend === 'down').length;
    const stable = allVegs.filter(v => v.trend === 'stable').length;
    document.getElementById('cnt-all').textContent    = allVegs.length;
    document.getElementById('cnt-up').textContent     = up;
    document.getElementById('cnt-down').textContent   = down;
    document.getElementById('cnt-stable').textContent = stable;
    document.getElementById('veg-count').textContent  = allVegs.length + ' vegetables';
  }

  // ─── Filters / Sort ──────────────────────────────────────────────────────
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.trend-pill').forEach(p => p.classList.remove('active-filter'));
    el.classList.add('active-filter');
    renderCards();
  }

  function setSort(s, el) {
    currentSort = s;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCards();
  }

  function getFiltered() {
    const q = document.getElementById('search').value.toLowerCase();
    let list = allVegs.filter(v => {
      const matchFilter = currentFilter === 'all' || v.trend === currentFilter;
      const matchSearch = !q || v.name_en.toLowerCase().includes(q)
                              || (v.name_hi || '').includes(q);
      return matchFilter && matchSearch;
    });

    list.sort((a, b) => {
      if (currentSort === 'name')       return a.name_en.localeCompare(b.name_en);
      if (currentSort === 'price-asc')  return a.latest_price - b.latest_price;
      if (currentSort === 'price-desc') return b.latest_price - a.latest_price;
      if (currentSort === 'change')     return Math.abs(b.change_pct) - Math.abs(a.change_pct);
      return 0;
    });
    return list;
  }

  // ─── Sparkline SVG ───────────────────────────────────────────────────────
  function buildSparkline(history) {
    if (!history || history.length < 2) return '';
    const prices = history.map(h => h.price);
    const min = Math.min(...prices);
    const max = Math.max(...prices);
    const W = 180, H = 32, pad = 2;
    const xStep = (W - pad * 2) / (prices.length - 1);
    const range = max - min || 1;
    const pts = prices.map((p, i) => {
      const x = pad + i * xStep;
      const y = H - pad - ((p - min) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const color = prices[prices.length - 1] >= prices[0] ? '#27ae60' : '#e74c3c';
    return `<div class="sparkline">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <polyline points="${pts.join(' ')}" fill="none" stroke="${color}"
          stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
        <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}"
          r="2.5" fill="${color}"/>
      </svg>
    </div>`;
  }

  // ─── Render ───────────────────────────────────────────────────────────────
  function renderCards() {
    const grid = document.getElementById('grid');
    const list = getFiltered();

    if (list.length === 0) {
      grid.innerHTML = '<div class="state-msg">कोई सब्ज़ी नहीं मिली · No vegetables found</div>';
      return;
    }

    const arrows  = { up: '▲', down: '▼', stable: '–' };
    const tLabels = { up: 'Rising', down: 'Falling', stable: 'Stable' };

    grid.innerHTML = list.map((v, i) => {
      const delay = Math.min(i * 30, 300);
      const trend = v.trend || 'stable';
      const badge = `<span class="trend-badge ${trend}">
        ${arrows[trend]} ${Math.abs(v.change_pct || 0).toFixed(1)}% ${tLabels[trend]}
      </span>`;
      return `
        <div class="veg-card trend-${trend}" style="animation-delay:${delay}ms">
          <div class="veg-name-hi">${v.name_hi || '—'}</div>
          <div class="veg-name-en">${v.name_en}</div>
          <div class="price-row">
            <span class="price-amount">₹${v.latest_price}</span>
            <span class="price-unit">/ ${v.unit || 'kg'}</span>
          </div>
          ${badge}
          ${buildSparkline(v.history)}
          <div class="card-date">${v.latest_date || ''}</div>
        </div>`;
    }).join('');
  }

  // ─── Demo data (shown when prices.json unavailable) ───────────────────────
  function getDemoData() {
    const items = [
      { name_hi: 'टमाटर',     name_en: 'Tomato',     price: 28, trend: 'down',   pct: -12.5 },
      { name_hi: 'प्याज़',     name_en: 'Onion',      price: 35, trend: 'up',     pct: 8.3  },
      { name_hi: 'आलू',       name_en: 'Potato',     price: 22, trend: 'stable', pct: 0    },
      { name_hi: 'हरी मिर्च',  name_en: 'Green Chilli',price: 80, trend: 'up',    pct: 25.0 },
      { name_hi: 'बैंगन',     name_en: 'Brinjal',    price: 30, trend: 'down',   pct: -5.2 },
      { name_hi: 'गोभी',      name_en: 'Cauliflower',price: 40, trend: 'stable', pct: 0    },
      { name_hi: 'भिंडी',     name_en: 'Lady Finger', price: 55, trend: 'up',    pct: 15.3 },
      { name_hi: 'पालक',      name_en: 'Spinach',    price: 20, trend: 'down',   pct: -8.0 },
      { name_hi: 'लहसुन',     name_en: 'Garlic',     price: 200, trend: 'up',    pct: 6.7  },
      { name_hi: 'अदरक',      name_en: 'Ginger',     price: 120, trend: 'stable',pct: 0    },
      { name_hi: 'करेला',     name_en: 'Bitter Gourd',price: 60, trend: 'up',    pct: 10.0 },
      { name_hi: 'शिमला मिर्च',name_en: 'Capsicum',  price: 90, trend: 'down',   pct: -4.4 },
    ];
    const today = new Date().toISOString().split('T')[0];
    return items.map(it => ({
      name_hi: it.name_hi,
      name_en: it.name_en,
      latest_price: it.price,
      unit: 'kg',
      currency: 'INR',
      trend: it.trend,
      change_pct: it.pct,
      latest_date: today,
      history: Array.from({ length: 7 }, (_, i) => ({
        date: new Date(Date.now() - (6 - i) * 86400000).toISOString().split('T')[0],
        price: +(it.price * (0.9 + Math.random() * 0.2)).toFixed(0),
      })),
    }));
  }

  loadData();
</script>
</body>
</html>
